#zeropsPreprocessor=on
#
# The Gitea project's services, as the Mate app sends them.
#
# Services only: no `project:` block. The app creates the project itself, tags
# it `mate:tool:gitea` and then imports this into it, so the project keeps the
# platform's default `envIsolation: service` — which is what stops a runner job
# reading Gitea's admin token or the database password (ledger 2026-09-16).
# Never set envIsolation here.
#
# The app replaces these placeholders before sending the file:
#
#   __ZEROPS_TOKEN__       the broker's Zerops token: org READ_ONLY, BASIC_USER
#                          on this project, and BASIC_USER on each group stage
#                          and production as they are created. Minted by the
#                          app as the owner. It reads and decides; since D27 a
#                          job deploys, on the environment's own deploy token,
#                          which the app writes onto the broker service later
#                          (MATE_DEPLOY_TOKEN_{HEX}, docs/vocabulary.md).
#   __ZEROPS_CLIENT_ID__   the org id.
#   __ZEROPS_PROJECT_ID__  this project's id — where the registry tags live.
#   __MATE_APP_URL__       the web app's origin; the sign-in consent page.
#   __REGION__             the region's name, e.g. `prg1` — what the app reads
#                          off the new project's `publicZone`. Both shapes are
#                          derived from it here: `api.app-{region}.zerops.io`
#                          for the API and `{host}.{region}.zerops.app` for a
#                          subdomain.
#
# No origin list: Gitea's [cors] and the broker's POST /person/token answer
# every origin (D22). Every browser call carries the person's token in a
# header and no cookie, so the origin proves nothing, and a Gitea made from
# one origin — mate.zerops.io, a developer's localhost — is driven from any.
#
# `<@generateRandomString(<64>)>` is the platform's preprocessor: the value is
# generated inside the import and never passes through the browser.

services:
  - hostname: db
    type: postgresql@18
    mode: NON_HA
    priority: 10

  - hostname: volume
    type: local-storage@1
    priority: 10

  - hostname: web
    type: ubuntu@26.04
    priority: 5
    buildFromGit: https://github.com/zeropsio/gitea-mate
    zeropsSetup: gitea
    enableSubdomainAccess: true
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
    vault:
      DB_PASSWORD:
        value: <@generateRandomString(<64>)>
        sensitive: true
      GITEA_DOMAIN: web-${zeropsSubdomainHost}-3000.__REGION__.zerops.app
      BROKER_PUBLIC_URL: https://broker-${zeropsSubdomainHost}-8080.__REGION__.zerops.app
      # Gitea's client secret for the `zerops` login source. The broker
      # generates nothing: the two services reference one another's values, so
      # the secret exists in exactly one place.
      OIDC_CLIENT_SECRET: ${broker_OIDC_CLIENT_SECRET}

  - hostname: broker
    type: ubuntu@26.04
    priority: 5
    buildFromGit: https://github.com/zeropsio/gitea-mate
    zeropsSetup: broker
    enableSubdomainAccess: true
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.25
    vault:
      # docs/vocabulary.md § "The broker's environment", with the MATE_ prefix
      # the platform forces on the four that name Zerops: a custom variable
      # beginning with `ZEROPS_` is refused by the import itself
      # (400 userDataZeropsPrefixForbidden, case-insensitive; measured
      # 2026-09-16).
      MATE_ZEROPS_TOKEN:
        value: __ZEROPS_TOKEN__
        sensitive: true
      MATE_ZEROPS_API_URL: https://api.app-__REGION__.zerops.io
      MATE_ZEROPS_CLIENT_ID: __ZEROPS_CLIENT_ID__
      MATE_ZEROPS_PROJECT_ID: __ZEROPS_PROJECT_ID__
      GITEA_URL: http://web:3000
      GITEA_PUBLIC_URL: https://web-${zeropsSubdomainHost}-3000.__REGION__.zerops.app
      # Gitea publishes both of these itself, on its first boot. The broker
      # needs the password as well as the token: Gitea's token routes answer
      # 401 "auth required" to an API token, however privileged (measured on
      # 1.27.2), so minting a Mate bot's credential takes basic auth. A
      # reference resolves in the broker's container and nowhere else — but
      # not necessarily before the first boot: a container can start holding
      # the literal `${…}`, so every reader treats that shape as not arrived
      # yet (measured 2026-09-16). The broker then reads both from web's own
      # variables through the API, and again whenever Gitea refuses them
      # (internal/siteadmin).
      GITEA_ADMIN_TOKEN:
        value: ${web_GITEA_ADMIN_TOKEN}
        sensitive: true
      GITEA_ADMIN_PASSWORD:
        value: ${web_GITEA_ADMIN_PASSWORD}
        sensitive: true
      GITEA_ADMIN_USERNAME: admin
      GITEA_WEBHOOK_SECRET:
        value: <@generateRandomString(<64>)>
        sensitive: true
      OIDC_CLIENT_SECRET:
        value: <@generateRandomString(<64>)>
        sensitive: true
      # The ES256 signing key is derived from this deterministically, so a
      # restart signs the same way and no key is ever stored.
      OIDC_SEED:
        value: <@generateRandomString(<64>)>
        sensitive: true
      BROKER_PUBLIC_URL: https://broker-${zeropsSubdomainHost}-8080.__REGION__.zerops.app
      MATE_APP_URL: __MATE_APP_URL__
      LISTEN_ADDR: :8080
