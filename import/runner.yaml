#
# One group's Actions runner, imported into the Gitea project by the broker
# when the group's first workflow appears.
#
# The broker replaces:
#
#   __HOSTNAME__  `runner` + the group's slug with its dashes removed, cut to
#                 25 characters (docs/vocabulary.md) — Zerops hostnames are
#                 [a-z0-9], 25 at most.
#   __TOKEN__     an org-scope registration token from
#                 POST /orgs/{org}/actions/runners/registration-token. Org
#                 scope, never the instance-wide route: labels route jobs, but
#                 only the registration scope isolates them, and our runners
#                 run jobs in host mode on one shared container.
#
# zcli is on this service and no credential is: a job that deploys asks the
# broker, which hands it one environment's key for the length of one push, and
# only while this runner has run nothing but default-branch jobs (D27). A
# runner that ran a branch's own workflow is deleted and imported afresh.
#
# Idle, the service is stopped; the broker starts it on a `workflow_job`
# `queued` webhook and stops it again after a quiet spell. Under load the
# platform's horizontal autoscaling adds containers up to maxContainers, one
# job each.

services:
  - hostname: __HOSTNAME__
    type: ubuntu@26.04
    buildFromGit: https://github.com/zeropsio/gitea-mate
    zeropsSetup: runner
    minContainers: 1
    maxContainers: 3
    verticalAutoscaling:
      minRam: 0.5
    vault:
      RUNNER_REGISTRATION_TOKEN:
        value: __TOKEN__
        sensitive: true
      GITEA_INSTANCE_URL: http://web:3000
