; Rendered from this service's environment by start.sh (`zsc envReplace`).
; Every setting guide 1.1 asks for is here, and the reasons are beside them.

APP_NAME  = Gitea
RUN_USER  = zerops
RUN_MODE  = prod
WORK_PATH = {{.GITEA_WORK_DIR}}

[server]
PROTOCOL      = http
DOMAIN        = {{.GITEA_DOMAIN}}
ROOT_URL      = https://{{.GITEA_DOMAIN}}
HTTP_ADDR     = 0.0.0.0
HTTP_PORT     = 3000
APP_DATA_PATH = {{.GITEA_WORK_DIR}}/data
LFS_START_SERVER = true
LFS_JWT_SECRET   = {{.LFS_JWT_SECRET}}
; SSH is off. Every git operation the account makes goes over HTTPS with a
; token the broker minted, so there is no key to steal and no second port to
; guard.
DISABLE_SSH      = true
START_SSH_SERVER = false

[database]
DB_TYPE  = postgres
HOST     = {{.DB_HOST}}:{{.DB_PORT}}
NAME     = {{.DB_NAME}}
USER     = {{.DB_USER}}
PASSWD   = {{.DB_PASSWORD}}
SSL_MODE = disable
SCHEMA   = public

[repository]
ROOT = {{.GITEA_WORK_DIR}}/data/gitea-repositories
; Nothing is public by accident.
DEFAULT_PRIVATE = private
; A commit archive must deploy as a Zerops app version as it is. Gitea's
; default prefixes the archive with the repository name, and the platform keeps
; an archive's top-level folder — the build then finds nothing at the root
; (measured 2026-09-15).
PREFIX_ARCHIVE_FILES = false

[lfs]
PATH = {{.GITEA_WORK_DIR}}/data/lfs

[log]
ROOT_PATH = {{.GITEA_WORK_DIR}}/log
MODE      = console
LEVEL     = info

[service]
; Anonymous reads are off: a person reaches this Gitea only after signing in
; through Zerops.
REQUIRE_SIGNIN_VIEW = true
; Registration itself stays enabled, because the OIDC source auto-registers on
; a first sign-in — but only external registration is allowed, so the sign-up
; form leads nowhere.
DISABLE_REGISTRATION             = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true
; The site admin signs in through Zerops like everyone else; its token and
; password are what automation uses. Leaving the password form on would be one
; credential the account's roles do not govern.
ENABLE_PASSWORD_SIGNIN_FORM = false
; Nobody creates repositories or organisations by hand: the broker makes the
; group orgs, and a Mate asks the broker for its repositories.
DEFAULT_ALLOW_CREATE_ORGANIZATION = false
USER_MAX_CREATION_LIMIT           = 0
DEFAULT_KEEP_EMAIL_PRIVATE        = true

[security]
INSTALL_LOCK   = true
SECRET_KEY     = {{.SECRET_KEY}}
INTERNAL_TOKEN = {{.INTERNAL_TOKEN}}
; No REVERSE_PROXY_* of any kind. REVERSE_PROXY_TRUSTED_PROXIES does not
; restrict who may send X-WEBAUTH-USER — a header from any address logs in as
; any user, the site admin included (measured 2026-09-15) — and the runners
; share this project's network.

[oauth2]
JWT_SECRET = {{.JWT_SECRET}}

[oauth2_client]
; A person arrives through the broker and has no local account to link to, so
; `auto` would only ever match the site admin.
ACCOUNT_LINKING          = disabled
ENABLE_AUTO_REGISTRATION = true
; The broker sends a username derived from the Zerops user id, never the
; e-mail's local part: two people's jan@ would collide.
USERNAME                = preferred_username
UPDATE_AVATAR           = false
REGISTER_EMAIL_CONFIRM  = false

[session]
PROVIDER = file
; A Gitea session is never re-validated against Zerops, so it is bounded: half
; a day, and the broker's rights loop handles departures in between.
SESSION_LIFE_TIME = 43200
COOKIE_SECURE     = true

[actions]
ENABLED = true
; A job nobody takes is cancelled after this, at a six-hourly sweep. The
; default is 24 h; two hours means a wake that failed surfaces the same day.
ABANDONED_JOB_TIMEOUT = 2h

; The Mate app drives this Gitea from the browser as the person, from whatever
; origin it is served from: mate.zerops.io, a developer's localhost, the desktop
; and mobile shells (D22). Every one of those calls carries the person's token
; in the Authorization header, so the origin proves nothing and ALLOW_DOMAIN is
; no lock: it is `*`, Gitea's own default once [cors] is on (measured on 1.27.2,
; 2026-09-17: the preflight and a token call answer `*` from any origin; a call
; with no token is 401 from any origin). Authorization is kept in HEADERS
; because every call carries a token. ALLOW_CREDENTIALS stays false, so a
; signed-in browser's Gitea cookie can never be used by another origin: the
; browser refuses a `*` answer to a request that carried one.
[cors]
ENABLED           = true
ALLOW_DOMAIN      = *
ALLOW_CREDENTIALS = false
HEADERS           = Content-Type,User-Agent,Authorization
