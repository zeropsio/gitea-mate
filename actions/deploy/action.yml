name: Deploy with zcli push
description: >-
  Deploys this commit to a group environment with `zcli push`. The job carries
  no Zerops credential: it asks the account's broker, which hands it the
  environment's deploy token only when the job runs the default branch's own
  workflow and holds exactly the commit protected state wants there.
author: Zerops Mate

inputs:
  environment:
    description: >-
      The environment to deploy, as environments.yaml names it, or a tier's
      name for the group's only environment of it. Empty for a job started by a
      push: it deploys whatever its branch feeds.
    required: false
    default: ""
  service:
    description: The service of that environment to deploy. Empty for every one this repository builds.
    required: false
    default: ""
  working-directory:
    description: Where the repository is checked out.
    required: false
    default: "."
  broker:
    description: The broker's URL inside the Gitea project.
    required: false
    default: http://broker:8080

runs:
  using: composite
  steps:
    - name: zcli push
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
        ENVIRONMENT: ${{ inputs.environment }}
        SERVICE: ${{ inputs.service }}
        WORKDIR: ${{ inputs.working-directory }}
        REPOSITORY: ${{ github.repository }}
        # The job's own token. It names this job and this repository to the
        # broker and dies 0.1 s after the job ends, so it cannot be replayed.
        # It is never written to a file and never echoed.
        JOB_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/deploy.sh
